<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Подложки и текстуры — варианты</title>
<style>
  :root { --ink: #0f1a2e; --muted: #5b6577; --bg: #e9edf2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: #fff; box-shadow: 0 1px 0 #dde3ea; padding: 12px 16px; }
  h1 { margin: 0 0 4px; font-size: 1.15rem; }
  .lead { margin: 0 0 10px; color: var(--muted); font-size: .9rem; max-width: 110ch; }
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  #tabs button { border: 1px solid #d3dae3; background: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
  #tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  #tabs .grp { width: 100%; margin: 6px 0 0; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .bar { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  #desc { flex: 1; font-size: .9rem; }
  .jump { display: flex; gap: 6px; }
  .jump button, [data-dev] { border: 1px solid #d3dae3; background: #fff; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: .8rem; cursor: pointer; }
  [data-dev][aria-pressed="true"] { background: #eef2f8; }
  .stage { display: flex; justify-content: center; padding: 16px; }
  iframe { border: 0; background: #fff; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.12); width: 100%; max-width: 1440px; height: calc(100vh - 210px); min-height: 560px; }
  iframe.mobile { max-width: 390px; }
</style>
</head>
<body>
<header>
  <h1>Подложки и фактуры — ненавязчиво, по образцу «Полдня»</h1>
  <p class="lead">Живая главная; выбранный вариант подставляется в полосу «Команда», блок цен и подвал. Фактуры — размытые снимки света, тонированные в синий и закрытые вуалью: видно движение света, а не предмет.</p>
  <div id="tabs"></div>
  <div class="bar">
    <div id="desc"></div>
    <div class="jump">
      <button data-go="komanda">К команде</button>
      <button data-go="ceny">К ценам</button>
      <button data-go="napravleniya">К направлениям</button>
      <button data-go="footer">К подвалу</button>
      <button data-dev="desktop" aria-pressed="true">Компьютер</button>
      <button data-dev="mobile" aria-pressed="false">Телефон</button>
    </div>
  </div>
</header>
<div class="stage"><iframe id="frame" title="Сайт с выбранной подложкой"></iframe></div>

<script>
  const SITE = new URLSearchParams(location.search).get('site') ?? '../site/';
  const TEX = (name) => new URL(`tex/${name}`, location.href).href;
  const svg = (w, h, body) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>${body}</svg>`)}")`;

  // ---------- Узоры кодом ----------
  // Зерно: шум, у которого непрозрачность задана альфой.
  const grain = (alpha = 0.08, freq = 0.85, color = '15 26 46') => {
    const [r, g, b] = color.split(' ').map((c) => (Number(c) / 255).toFixed(3));
    return svg(260, 260, `<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 ${r} 0 0 0 0 ${g} 0 0 0 0 ${b} 0 0 0 ${alpha * 9} -${alpha * 3}'/></filter><rect width='100%' height='100%' filter='url(#n)'/>`);
  };
  // Холст: частые горизонтальные и вертикальные нити, слегка дрожащие.
  const weave = (color = '#0f1a2e', a = 0.07) => svg(120, 120, `<filter id='d'><feTurbulence type='fractalNoise' baseFrequency='0.9 0.05' numOctaves='2' seed='3'/><feDisplacementMap in='SourceGraphic' scale='2.4'/></filter><g filter='url(#d)' stroke='${color}' stroke-opacity='${a}' stroke-width='1'>${Array.from({ length: 40 }, (_, i) => `<path d='M0 ${i * 3 + 1}H120'/>`).join('')}${Array.from({ length: 40 }, (_, i) => `<path d='M${i * 3 + 1} 0V120' stroke-opacity='${a * 0.6}'/>`).join('')}</g>`);
  // Акварельное пятно: круг, размытый турбулентностью, с более тёмным краем.
  const blob = (color, op = 0.35, seed = 2, w = 700, h = 520) => svg(w, h, `<filter id='w' x='-30%' y='-30%' width='160%' height='160%'><feTurbulence type='fractalNoise' baseFrequency='0.008' numOctaves='4' seed='${seed}'/><feDisplacementMap in='SourceGraphic' scale='170'/><feGaussianBlur stdDeviation='5'/></filter><filter id='e' x='-30%' y='-30%' width='160%' height='160%'><feTurbulence type='fractalNoise' baseFrequency='0.008' numOctaves='4' seed='${seed}'/><feDisplacementMap in='SourceGraphic' scale='170'/><feGaussianBlur stdDeviation='1.2'/></filter><g filter='url(#w)'><ellipse cx='${w / 2}' cy='${h / 2}' rx='${w * 0.3}' ry='${h * 0.3}' fill='${color}' fill-opacity='${op}'/></g><g filter='url(#e)'><ellipse cx='${w / 2}' cy='${h / 2}' rx='${w * 0.3}' ry='${h * 0.3}' fill='none' stroke='${color}' stroke-opacity='${op * 0.9}' stroke-width='3'/></g>`);
  // Мазок кистью: толстая линия с рваным краем и полосами от щетины.
  const stroke = (color, seed = 4, w = 900, h = 260, d = 'M60 170 C 260 60, 560 210, 840 90') => svg(w, h, `<filter id='b' x='-10%' y='-30%' width='120%' height='160%'><feTurbulence type='fractalNoise' baseFrequency='0.02 0.3' numOctaves='3' seed='${seed}'/><feDisplacementMap in='SourceGraphic' scale='26'/></filter><mask id='m'><rect width='100%' height='100%' fill='white'/><g stroke='black' stroke-width='1.4' opacity='.55'>${Array.from({ length: 14 }, (_, i) => `<path d='${d}' transform='translate(0 ${i * 5 - 35})' fill='none'/>`).join('')}</g></mask><g filter='url(#b)' mask='url(#m)'><path d='${d}' fill='none' stroke='${color}' stroke-width='78' stroke-linecap='round'/></g>`);
  // Двойная улыбка из логотипа — тонкими линиями, как графический мотив.
  const smiles = (color = '#c4643f', a = 0.5) => svg(420, 240, `<g fill='none' stroke='${color}' stroke-opacity='${a}' stroke-linecap='round'><path d='M30 70 C 130 150, 290 150, 390 60' stroke-width='3'/><path d='M80 120 C 160 175, 270 175, 345 110' stroke-width='3'/><path d='M120 165 C 180 200, 250 200, 305 160' stroke-width='2' stroke-opacity='${a * 0.6}'/></g>`);
  // Мазки краски из палитры логотипа — короткие капли.
  const dabs = (seed = 1) => {
    const cols = ['#d6a548', '#a8436f', '#8e74b6', '#33568f', '#c4643f'];
    let x = seed * 97, rnd = () => ((x = (x * 9301 + 49297) % 233280) / 233280);
    const items = Array.from({ length: 14 }, () => `<ellipse cx='${(rnd() * 380 + 20).toFixed(0)}' cy='${(rnd() * 380 + 20).toFixed(0)}' rx='${(rnd() * 16 + 6).toFixed(0)}' ry='${(rnd() * 9 + 4).toFixed(0)}' transform='rotate(${(rnd() * 180).toFixed(0)})' fill='${cols[Math.floor(rnd() * cols.length)]}' fill-opacity='.8'/>`).join('');
    return svg(420, 420, `<filter id='r'><feTurbulence baseFrequency='0.05' numOctaves='2' seed='${seed}'/><feDisplacementMap in='SourceGraphic' scale='9'/></filter><g filter='url(#r)'>${items}</g>`);
  };

  // ---------- Общие куски CSS ----------
  const T = '.team.band';
  const PR = 'section[aria-labelledby="ceny"]';
  const DIR = 'section[aria-labelledby="napravleniya"]';
  const F = '.site-footer';
  const BASE = `${T}, ${PR}, ${DIR} { position: relative; isolation: isolate; }
    ${T} > .wrap, ${PR} > .wrap, ${DIR} > .wrap { position: relative; z-index: 1; }
    ${PR}, ${DIR} { overflow: clip; }`;
  // Объект у края: картинка в ::before/::after секции, может выходить за контейнер контента.
  const edge = (sel, pseudo, img, pos, size, extra = '') => `${sel}::${pseudo} { content: ''; position: absolute; ${pos}; width: ${size}; aspect-ratio: 1; background: ${img} center / contain no-repeat; pointer-events: none; z-index: 0; ${extra} }`;
  const navyFooter = (layer) => `${F} { background: ${layer}, #13203a !important; }`;

  // Как у «Полдня»: размытый низкоконтрастный снимок света, тонированный в цвет бренда
  // (режим «яркость» берёт оттенок у цвета под снимком), сверху вуаль. Видно только движение света.
  const NAVY = '19 32 58';
  const footerPhoto = (img, veil = 0.45) => `${F} { background: linear-gradient(rgb(${NAVY} / ${veil}), rgb(${NAVY} / ${veil})), url(${TEX(img)}) center / cover, rgb(${NAVY}) !important; background-blend-mode: normal, luminosity, normal !important; }`;
  const bandPhoto = (img, op = 1) => `${T} { background: linear-gradient(rgb(233 238 245 / ${1 - op}), rgb(233 238 245 / ${1 - op})), url(${TEX(img)}) center / cover, var(--color-bg-sunken) !important; background-blend-mode: normal, luminosity, normal !important; }`;
  const glowBand = `${T} { background: radial-gradient(40% 70% at 8% 10%, rgb(51 86 143 / .16), transparent 70%), radial-gradient(35% 60% at 95% 100%, rgb(196 100 63 / .14), transparent 70%), var(--color-bg-sunken) !important; }`;
  const glowFooter = navyFooter('radial-gradient(45% 80% at 10% 0%, rgb(110 150 220 / .3), transparent 70%), radial-gradient(40% 70% at 100% 100%, rgb(196 100 63 / .22), transparent 70%)');
  const glowPrices = `${PR} { background: radial-gradient(35% 55% at 0% 30%, rgb(51 86 143 / .08), transparent 70%), radial-gradient(30% 50% at 100% 90%, rgb(196 100 63 / .07), transparent 70%); }`;

  const V = [
    { grp: 'Нравится' },
    { id: 's0', t: 'Мягкое свечение', d: '<b>Ваш выбор.</b> Размытые пятна света синего и терракоты на полосе команды и в подвале. Без фактуры, просто глубина.',
      css: `${glowBand} ${glowFooter}` },
    { grp: 'Ненавязчивая фактура (по образцу «Полдня»)' },
    { id: 's1', t: 'Луч на стене', d: '<b>Самый близкий к «Полдню».</b> В подвале — косой луч света на гипсе, размытый и тонированный в синий, под вуалью. Полоса команды — тот же свет, едва заметный.',
      css: `${bandPhoto('l-luch.jpg', 0.55)} ${footerPhoto('f-luch.jpg', 0.25)}` },
    { id: 's2', t: 'Свет из окна', d: '<b>Утренний кабинет.</b> Размытые полосы света от окна и тюля: в подвале чуть заметнее, на полосе команды — только переход светлее-темнее.',
      css: `${bandPhoto('l-okno.jpg', 0.6)} ${footerPhoto('f-okno.jpg', 0.25)}` },
    { id: 's3', t: 'Холст', d: '<b>Только на ощупь.</b> Фактура холста почти не видна глазом — даёт ощущение материала вместо плоской заливки. В подвале чуть сильнее.',
      css: `${bandPhoto('l-holst.jpg', 0.5)} ${footerPhoto('f-holst.jpg', 0.5)}` },
    { grp: 'Свечение + фактура' },
    { id: 's4', t: 'Свечение + луч в подвале', d: '<b>Комбинация.</b> Полоса команды и цены — мягкое свечение, подвал — луч на стене. Светлые блоки чистые, тёмный низ — живой.',
      css: `${glowBand} ${glowPrices} ${footerPhoto('f-luch.jpg', 0.25)}` },
    { id: 's5', t: 'Свечение + зерно', d: '<b>Свечение с плёночным зерном.</b> То же свечение, но с едва заметным зерном, как на снимках «Полдня» — заливки перестают выглядеть «цифровыми».',
      css: `${T} { background: ${grain(0.035)}, radial-gradient(40% 70% at 8% 10%, rgb(51 86 143 / .16), transparent 70%), radial-gradient(35% 60% at 95% 100%, rgb(196 100 63 / .14), transparent 70%), var(--color-bg-sunken) !important; } ${navyFooter(`${grain(0.05, 0.85, '255 255 255')}, radial-gradient(45% 80% at 10% 0%, rgb(110 150 220 / .3), transparent 70%), radial-gradient(40% 70% at 100% 100%, rgb(196 100 63 / .22), transparent 70%)`)}` },
    { id: 's6', t: 'Свечение + свет из окна', d: '<b>Комбинация.</b> Полоса команды — свечение, подвал — размытый свет из окна.',
      css: `${glowBand} ${glowPrices} ${footerPhoto('f-okno.jpg', 0.25)}` },
  ];

  const frame = document.getElementById('frame');
  let current = V.find((v) => v.id === 's1');

  function apply() {
    const doc = frame.contentDocument;
    if (!doc || !doc.head) return;
    let st = doc.getElementById('tex-override');
    if (!st) { st = doc.createElement('style'); st.id = 'tex-override'; doc.head.append(st); }
    st.textContent = current.css + ' [data-cookie-banner]{display:none!important}';
    doc.querySelectorAll('[data-reveal]').forEach((e) => e.classList.add('is-in', 'is-revealed'));
  }
  frame.addEventListener('load', () => {
    apply();
    frame.contentDocument.addEventListener('astro:page-load', apply);
  });
  function select(v) {
    current = v;
    document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === v.id)));
    document.getElementById('desc').innerHTML = v.d;
    apply();
  }
  document.getElementById('tabs').innerHTML = V.map((v) => (v.grp ? `<span class="grp">${v.grp}</span>` : `<button data-id="${v.id}" aria-pressed="false">${v.t}</button>`)).join('');
  document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => select(V.find((v) => v.id === b.dataset.id))));
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => {
    const doc = frame.contentDocument;
    const el = b.dataset.go === 'footer' ? doc.querySelector('.site-footer') : doc.getElementById(b.dataset.go);
    el?.scrollIntoView({ block: 'start' });
    frame.contentWindow.scrollBy(0, -120);
  }));
  document.querySelectorAll('[data-dev]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-dev]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    frame.classList.toggle('mobile', b.dataset.dev === 'mobile');
  }));
  select(current);
  frame.src = SITE;
</script>
</body>
</html>
